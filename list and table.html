<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ol>
        <li>Mango</li>
        <li>Apple</li>
        <li>orange</li>
    </ol>
    <!-- yha prr hmeshaa order me 1,2,3 serial no. hi aayenge agar change krna hh toh type attribute use kro ol ke andar -->
     <ol type="A">
        <li>Mango</li>
        <li>Apple</li>
        <li>orange</li>
    </ol>

    <ul>
        <li>Mango</li>
        <li>Strawberry</li>
        <li>orange</li>

    </ul>
<!-- nested list -->
    <ol type="A">
        <li>Mango
            <ul>
                <li>badam</li>
                <li>dasheri</li>
                <li>ratnagiri</li>
            </ul>
        </li>
        <li>Apple
            <ul type="disc"> <!-- disc se bullet points aa jayenge -->
                <li>himachali</li>
                <li>kashmiri</li>
            </ul>
        </li>
        <li>orange</li>
    </ol>
</body>
</html>
